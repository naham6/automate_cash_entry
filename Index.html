<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <title>Daily Cash Collection</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    body {
      display: flex;
      justify-content: center;
      padding: 20px 14px;
    }

    .app {
      width: 100%;
      max-width: 480px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 24px 20px 22px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      margin: 0;
      font-size: 27px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .header .line {
      width: 55px;
      height: 4px;
      border-radius: 10px;
      background: #1769e0;
      margin: 10px auto 0;
    }

    .date-box {
      background: #eef5ff;
      border-radius: 14px;
      padding: 15px;
      text-align: center;
      margin-bottom: 22px;
    }

    .date-label {
      font-size: 13px;
      color: #60708a;
      margin-bottom: 4px;
      font-weight: 600;
    }

    .date-value {
      font-size: 20px;
      font-weight: 750;
      color: #1769e0;
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    select,
    input {
      width: 100%;
      height: 56px;
      border: 1px solid #ccd5e1;
      border-radius: 13px;
      background: white;
      padding: 0 15px;
      font-size: 18px;
      color: #172033;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }

    select:focus,
    input:focus {
      border-color: #1769e0;
      box-shadow: 0 0 0 3px rgba(23, 105, 224, 0.12);
    }

    select:disabled,
    input:disabled {
      background: #f0f3f8;
      color: #68758a;
      cursor: not-allowed;
      opacity: 1;
    }

    .select-wrapper {
      position: relative;
    }

    .select-wrapper::after {
      content: "▼";
      position: absolute;
      right: 17px;
      top: 18px;
      font-size: 12px;
      color: #617089;
      pointer-events: none;
    }

    input[type="number"] {
      -moz-appearance: textfield;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      opacity: 1;
    }

    .save-button {
      width: 100%;
      height: 62px;
      border: none;
      border-radius: 15px;
      background: #1769e0;
      color: white;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.4px;
      cursor: pointer;
      margin-top: 3px;
      box-shadow: 0 5px 15px rgba(23, 105, 224, 0.25);
    }

    .save-button:active {
      transform: scale(0.98);
    }

    .save-button:disabled {
      background: #9db6da;
      cursor: not-allowed;
      box-shadow: none;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 15px;
      border-radius: 13px;
      font-size: 15px;
      line-height: 1.45;
    }

    .message.success {
      display: block;
      background: #eaf8ef;
      color: #176b38;
      border: 1px solid #bce7ca;
    }

    .message.error {
      display: block;
      background: #fff0f0;
      color: #a52828;
      border: 1px solid #f0c0c0;
    }

    .message.warning {
      display: block;
      background: #fff8e5;
      color: #755700;
      border: 1px solid #eed78c;
    }

    .message-title {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .confirmation-actions {
      display: flex;
      gap: 9px;
      margin-top: 13px;
    }

    .confirm-button {
      flex: 1;
      min-height: 48px;
      border-radius: 11px;
      border: none;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .add-button {
      background: #1769e0;
      color: white;
    }

    .replace-button {
      background: #fff;
      color: #9b3030;
      border: 1px solid #e0aaaa;
    }

    .cancel-button {
      background: #e9edf3;
      color: #37445a;
    }

    .loading {
      text-align: center;
      padding: 25px 10px;
      color: #60708a;
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid #d8e2f0;
      border-top-color: #1769e0;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .footer {
      text-align: center;
      margin-top: 15px;
      font-size: 12px;
      color: #8a96a8;
    }

    @media (max-width: 380px) {
      body {
        padding: 12px 10px;
      }

      .card {
        padding: 20px 15px;
      }

      .header h1 {
        font-size: 24px;
      }

      select,
      input {
        height: 53px;
      }
    }

    .date-box input[type="date"] {
      width: 100%;
      height: 50px;
      border: 1px solid #ccd5e1;
      border-radius: 12px;
      background: white;
      padding: 0 12px;
      font-size: 18px;
      color: #1769e0;
      font-weight: 700;
      text-align: center;
      outline: none;
    }

    .date-box input[type="date"]:focus {
      border-color: #1769e0;
      box-shadow: 0 0 0 3px rgba(23, 105, 224, 0.12);
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="card">

      <div class="header">
        <h1>DAILY Cash Collection</h1>
        <div class="line"></div>
      </div>

      <!-- Loading -->
      <div id="loading" class="loading">
        <span class="spinner"></span>
        Loading...
      </div>

      <!-- ACCESS CODE -->
      <div id="accessForm">
        <div class="field">
          <label for="accessCode">Access code</label>

          <input
            id="accessCode"
            type="password"
            inputmode="numeric"
            pattern="[0-9]*"
            maxlength="4"
            placeholder="Enter 4-digit code"
            autocomplete="off"
          >
        </div>

        <button
          id="accessButton"
          class="save-button"
          onclick="verifyAccess()">
          CONTINUE
        </button>

        <div id="accessMessage" class="message"></div>
      </div>

      <!-- MAIN FORM -->
      <div id="mainForm" style="display:none;">

        <!-- DATE -->
        <div class="date-box">
          <div class="date-label">Date</div>

          <input
            id="selectedDate"
            type="date"
            onclick="this.showPicker()"
          >
        </div>

        <!-- COLLECTION TYPE -->
        <div class="field">
          <label for="collectionType">Collection Type</label>

          <div class="select-wrapper">
            <select
              id="collectionType"
              onchange="handleSectionChange()">
              <option value="">Select collection type</option>
            </select>
          </div>
        </div>

        <!-- SALESPERSON -->
        <div class="field">
          <label for="salesperson">Salesperson</label>

          <div class="select-wrapper">
            <select id="salesperson">
              <option value="">Select salesperson</option>
            </select>
          </div>
        </div>

        <!-- COLLECTION AMOUNT -->
        <div class="field">
          <label for="salesAmount">Collection amount</label>

          <input
            id="salesAmount"
            type="number"
            min="0.00"
            step="any"
            inputmode="decimal"
            placeholder="Enter Cash Amount"
            autocomplete="off"
          >
        </div>

        <!-- SAVE -->
        <button
          id="saveButton"
          class="save-button"
          onclick="saveSale()">
          SAVE
        </button>

        <!-- MESSAGE -->
        <div id="message" class="message"></div>
      </div>
    </div>

    <div class="footer">
      Preview mode
    </div>
  </div>

  <script>

    /** GLOBAL VARIABLES**/

    let appData = null;
    let pendingSale = null;

    //True while a server request is in progress.
    let requestInProgress = false;

    //Keeps the form locked during a request or while ADD/REPLACE confirmation is displayed.
    
    let formLocked = false;

    let savingInProgress = false;


    /** DATE PICKER**/

    function setupDatePicker() {
      const dateInput =
        document.getElementById("selectedDate");

      const now = new Date();

      const year = now.getFullYear();
      const month = now.getMonth();

      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);

      function formatDate(date) {
        const y = date.getFullYear();

        const m = String(
          date.getMonth() + 1
        ).padStart(2, "0");

        const d = String(
          date.getDate()
        ).padStart(2, "0");

        return y + "-" + m + "-" + d;
      }

      dateInput.min = formatDate(firstDay);
      dateInput.max = formatDate(lastDay);
    }



    window.addEventListener("load", loadApp);


    /**VERIFY ACCESS CODE**/

function verifyAccess() {
  const code = document.getElementById("accessCode").value.trim();
  const button = document.getElementById("accessButton");
  const message = document.getElementById("accessMessage");

  message.className = "message";
  message.textContent = "";
  message.style.display = "none";

  if (!/^\d{4}$/.test(code)) {
    message.className = "message error";
    message.textContent = "Please enter the 4-digit access code.";
    message.style.display = "block";
    return;
  }

  //Demo-only access for the GitHub preview
  if (code !== "1234") {
    message.className = "message error";
    message.textContent = "Incorrect access code.";
    message.style.display = "block";
    return;
  }

  message.className = "message error";
  message.textContent =
    "Access code accepted, but no spreadsheet data is connected yet. Please try again later.";
  message.style.display = "block";
}



    function loadApp() {
      document.getElementById("loading").style.display =
        "none";

      document.getElementById("accessForm").style.display =
        "block";

      document.getElementById("mainForm").style.display =
        "none";

      document.getElementById("accessCode").focus();
    }



    function handleAppData(data) {
      document.getElementById("loading").style.display =
        "none";

      if (!data || !data.success) {
        showMessage(
          data && data.message
            ? data.message
            : "Could not load the Cash Collection system.",
          "error"
        );
        return;
      }

      appData = data;

      document.getElementById("selectedDate").value =
        data.selectedDate;

      setupDatePicker();

      const sectionSelect =
        document.getElementById("collectionType");

      sectionSelect.innerHTML =
        '<option value="">Select collection type</option>';

      (data.sections || []).forEach(function(section) {
        const option = document.createElement("option");

        option.value = section.name;
        option.textContent = section.name;

        sectionSelect.appendChild(option);
      });

      populateSalespeople("");

      document.getElementById("accessForm").style.display =
        "none";

      document.getElementById("mainForm").style.display =
        "block";

      sectionSelect.focus();
    }


    function handleSectionChange() {
      // Do not allow the selected collection to change while a request or confirmation is active.
      if (formLocked) {
        return;
      }

      clearMessage();

      pendingSale = null;

      const sectionName =
        document.getElementById("collectionType").value;

      populateSalespeople(sectionName);
    }



    function populateSalespeople(sectionName) {
      const select =
        document.getElementById("salesperson");

      select.innerHTML =
        '<option value="">Select salesperson</option>';

      if (!sectionName || !appData || !appData.sections) {
        select.disabled = true;
        return;
      }

      const section = appData.sections.find(function(item) {
        return item.name === sectionName;
      });

      if (!section) {
        select.disabled = true;
        return;
      }

      (section.salespeople || []).forEach(function(name) {
        const option = document.createElement("option");

        option.value = name;
        option.textContent = name;

        select.appendChild(option);
      });

      select.disabled = false;
    }


    function saveSale() {

      if (requestInProgress || formLocked || pendingSale) {
        return;
      }

      clearMessage();

      const sectionName =
        document.getElementById("collectionType").value.trim();

      const salesperson =
        document.getElementById("salesperson").value.trim();

      const amountText =
        document.getElementById("salesAmount").value.trim();

      if (!sectionName) {
        showMessage(
          "Please select a collection type.",
          "error"
        );

        document.getElementById("collectionType").focus();
        return;
      }

      if (!salesperson) {
        showMessage(
          "Please select a salesperson.",
          "error"
        );

        document.getElementById("salesperson").focus();
        return;
      }

      const amount = Number(amountText);

      //Zero remains accepted
      if (!Number.isFinite(amount) || amount < 0) {
        showMessage(
          "Please enter a valid amount greater than 0.",
          "error"
        );

        document.getElementById("salesAmount").focus();
        return;
      }

      const selectedDate =
        document.getElementById("selectedDate").value;

      if (!selectedDate) {
        showMessage(
          "Please select a valid date.",
          "error"
        );

        document.getElementById("selectedDate").focus();
        return;
      }

      pendingSale = {
        sectionName: sectionName,
        salesperson: salesperson,
        amount: amount,
        selectedDate: selectedDate
      };

      requestInProgress = true;
      setFormLocked(true);
      setSaving(true);

      google.script.run
        .withSuccessHandler(handleCheckResult)
        .withFailureHandler(handleServerFailure)
        .checkSale(
          salesperson,
          amount,
          selectedDate,
          sectionName
        );
    }




    function handleCheckResult(result) {
      requestInProgress = false;
      setSaving(false);

      if (!result || !result.success) {
        pendingSale = null;
        setFormLocked(false);

        showMessage(
          result && result.message
            ? result.message
            : "Could not check the selected date's collection.",
          "error"
        );

        return;
      }

      if (result.previousValue === 0) {
        performSave("ADD");
        return;
      }

      showConfirmation(result);
    }


    function showConfirmation(result) {
      const message =
        document.getElementById("message");

      message.className = "message warning";

      message.innerHTML =
        "<div class='message-title'>" +
          "Collection already exists" +
        "</div>" +

        "<div>" +
          "Collection type: <strong>" +
            escapeHtml(
              result.section || pendingSale.sectionName
            ) +
          "</strong>" +
        "</div>" +

        "<div>" +
          escapeHtml(result.salesperson) +
          " already has " +
          "<strong>" +
            escapeHtml(String(result.previousValue)) +
          "</strong>" +
          " recorded on the selected date." +
        "</div>" +

        "<div>" +
          "New amount: <strong>" +
            escapeHtml(String(result.amountEntered)) +
          "</strong>" +
        "</div>" +

        "<div class='confirmation-actions'>" +

          "<button " +
            "type='button' " +
            "class='confirm-button add-button' " +
            "onclick=\"performSave('ADD')\">" +
            "ADD" +
          "</button>" +

          "<button " +
            "type='button' " +
            "class='confirm-button replace-button' " +
            "onclick=\"performSave('REPLACE')\">" +
            "REPLACE" +
          "</button>" +

          "<button " +
            "type='button' " +
            "class='confirm-button cancel-button' " +
            "onclick=\"cancelPendingSale()\">" +
            "CANCEL" +
          "</button>" +

        "</div>";

      message.style.display = "block";
    }


    function performSave(action) {
      if (!pendingSale || requestInProgress) {
        return;
      }

      // Keep the form locked from the original check until the transaction completes or fails.
      requestInProgress = true;
      setFormLocked(true);
      setSaving(true);

      google.script.run
        .withSuccessHandler(handleSaveResult)
        .withFailureHandler(handleServerFailure)
        .saveSale(
          pendingSale.salesperson,
          pendingSale.amount,
          action,
          pendingSale.selectedDate,
          pendingSale.sectionName
        );
    }


    function handleSaveResult(result) {
      requestInProgress = false;
      setSaving(false);

      if (!result || !result.success) {
        pendingSale = null;
        setFormLocked(false);

        showMessage(
          result && result.message
            ? result.message
            : "Could not update the Sheet.",
          "error"
        );

        return;
      }

      showSuccess(result);

      pendingSale = null;
      setFormLocked(false);
    }


    function cancelPendingSale() {
      if (requestInProgress) {
        return;
      }

      pendingSale = null;

      setFormLocked(false);
      clearMessage();

      document.getElementById("salesAmount").focus();
    }



    function showSuccess(result) {
      const message =
        document.getElementById("message");

      message.className = "message success";

      message.innerHTML =
        "<div class='message-title'>" +
          "✓ Saved successfully!" +
        "</div>" +

        "<div>" +
          "Collection type: <strong>" +
            escapeHtml(result.section || "") +
          "</strong>" +
        "</div>" +

        escapeHtml(result.salesperson) +

        "<br>" +

        "Selected date collection: <strong>" +
          escapeHtml(String(result.newValue)) +
        "</strong>";

      message.style.display = "block";

      document.getElementById("salesAmount").value = "";
    }


    function handleServerFailure(error) {

      requestInProgress = false;
      pendingSale = null;

      setSaving(false);
      setFormLocked(false);

      document.getElementById("loading").style.display =
        "none";

      console.error("FULL SERVER ERROR:", error);

      let errorText = "Unknown server error";

      if (error) {
        if (error.message) {
          errorText = error.message;
        } else {
          try {
            errorText = JSON.stringify(error);
          } catch (ignore) {
            errorText = String(error);
          }
        }
      }

      const mainForm =
        document.getElementById("mainForm");

      if (mainForm.style.display !== "none") {
        showMessage(
          "REAL ERROR: " + errorText,
          "error"
        );
      } else {
        const accessMessage =
          document.getElementById("accessMessage");

        accessMessage.className = "message error";
        accessMessage.textContent =
          "Could not complete the request: " + errorText;

        accessMessage.style.display = "block";
      }
    }



    function showMessage(text, type) {
      const message =
        document.getElementById("message");

      message.className = "message " + type;
      message.textContent = text;
      message.style.display = "block";
    }


    function clearMessage() {
      const message =
        document.getElementById("message");

      message.style.display = "none";
      message.innerHTML = "";
    }


    function setFormLocked(locked) {
      formLocked = locked;

      document.getElementById("selectedDate").disabled =
        locked;

      document.getElementById("collectionType").disabled =
        locked;

      document.getElementById("salesperson").disabled =
        locked;

      document.getElementById("salesAmount").disabled =
        locked;

      // Keep the Save button disabled if either the form is locked or a save/check request is in progress.
      document.getElementById("saveButton").disabled =
        locked || savingInProgress;
    }


    function setSaving(isSaving) {
      savingInProgress = isSaving;

      const button =
        document.getElementById("saveButton");

      button.disabled =
        formLocked || savingInProgress;

      button.textContent =
        savingInProgress ? "SAVING..." : "SAVE";
    }



    function escapeHtml(value) {
      const div = document.createElement("div");
      div.textContent = value;
      return div.innerHTML;
    }



    document.addEventListener("DOMContentLoaded", function() {
      document.getElementById("accessCode")
        .addEventListener("keydown", function(event) {
          if (event.key === "Enter") {
            event.preventDefault();
            verifyAccess();
          }
        });

      document.getElementById("salesAmount")
        .addEventListener("keydown", function(event) {
          if (event.key === "Enter") {
            event.preventDefault();
            saveSale();
          }
        });
    });
  </script>
</body>
</html>
